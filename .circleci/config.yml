version: 2.1

jobs:
  build:
    machine:
      image: ubuntu-2004:2023.09.1
    working_directory: ~/ci_app
    environment:
      - DX_CLI_URL: https://developer.salesforce.com/media/salesforce-cli/sf/channels/stable/sf-linux-x64.tar.xz
      - HUB_SFDX_USER: devashish.vhardwaj476@agentforce.com
      - DECRYPTION_KEY: 7110EDA4D09E062AA5E4A390B0A572AC0D2C0220FDCD11E0D3807C2005BA7E1E
      - DECRYPTION_IV: 687D8551274F1884C382C201AC6DDA41
      - HUB_CONSUMER_KEY: 3MVG9dAEux2v1sLvDuGJeYxUU3SbUT35gwFpIyS4GAFcX57FjCb_aAbLynJI47lKue9.mhz7zq9qOoGj7D6tT
    steps:
      - checkout
      - run:
          name: Check Architecture
          command: |
             uname -m

      - run:
          name: Download CLI
          command: |
            mkdir sfdx
            wget -qO- $DX_CLI_URL | tar xJ -C sfdx --strip-components 1
      - run:
          name: Install CLI
          command: |
            ./sfdx/install
            sfdx --version
            mkdir tmp
      - run:
          name: Create hub key
          command: |
            echo 'make hub key'
            openssl enc -nosalt -aes-256-cbc -d -in assets/server.key.enc -out assets/server.key -base64 -K $DECRYPTION_KEY -iv $DECRYPTION_IV
      - run:
          name: Setup Org
          command: |
            echo 'Running tests'
            sfdx force:auth:jwt:grant --clientid $HUB_CONSUMER_KEY --jwtkeyfile assets/server.key --username $HUB_SFDX_USER --setdefaultdevhubusername -a hub
            sfdx force --help
            sfdx force:org:create -s -f ~/ci_app/config/project-scratch-def.json -a circle_build_$CIRCLE_BUILD_NUM --wait 2
            sfdx force:source:push -u circle_build_$CIRCLE_BUILD_NUM
      - run:
          name: Run Apex Tests
          command: |
            mkdir -p ~/junit
            sfdx force:apex:test:run -c -d ~/junit -r junit --wait 5
      - store_test_results:
          path: ~/junit
      - run:
          name: Delete Useless Scratch Org
          command: |
            sfdx force:org:delete -u circle_build_$CIRCLE_BUILD_NUM -p
workflows:
  version: 2
  build:
    jobs:
      - build
